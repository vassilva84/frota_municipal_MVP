<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOM v3.0 — Gestão de Obras de Manutenção de Frota</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #gomLoading {
      position:fixed;inset:0;z-index:9999;
      background:linear-gradient(135deg,#123566 0%,#1a4d8f 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      transition:opacity .4s ease;
    }
    #gomLoading.oculto{opacity:0;pointer-events:none;}
    .ll{display:flex;align-items:center;gap:14px;}
    .ll svg{color:#60a5fa;}
    .ll-text .org{font-size:12px;opacity:.65;letter-spacing:.06em;text-transform:uppercase;color:#fff;}
    .ll-text .sys{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em;}
    .l-spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.15);border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite;}
    .l-bar-w{width:200px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
    .l-bar{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .35s ease;}
    .l-msg{color:rgba(255,255,255,.6);font-size:12px;letter-spacing:.03em;}
    @keyframes spin{to{transform:rotate(360deg);}}
    body.a-carregar .sidebar,body.a-carregar #main-content{opacity:0;transition:opacity .4s ease;}
  </style>
</head>
<body class="a-carregar">

<!-- LOADING -->
<div id="gomLoading" role="status" aria-label="A carregar GOM v3.0">
  <div class="ll">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="38" height="38">
      <path d="M5 17H3v-7l2-5h14l2 5v7h-2"/>
      <path d="M5 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0zm10 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <div class="ll-text">
      <div class="org">Município · Serviço de Frotas</div>
      <div class="sys">GOM v3.0</div>
    </div>
  </div>
  <div class="l-spin"></div>
  <div class="l-bar-w"><div class="l-bar" id="loadingBar"></div></div>
  <div class="l-msg" id="loadingMsg">A inicializar sistema…</div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-area">
      <div class="logo-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <path d="M5 17H3v-7l2-5h14l2 5v7h-2"/>
          <path d="M5 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0zm10 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="org-name">Município</span>
        <span class="system-name">GOM — Frotas</span>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul>
      <li>
        <a href="#" class="nav-link active" data-page="dashboard">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/>
              <rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
            </svg>
          </span>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a href="#" class="nav-link" data-page="veiculos">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <path d="M5 17H3v-7l2-5h14l2 5v7h-2"/>
              <path d="M5 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0zm10 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </span>
          <span>Veículos</span>
        </a>
      </li>
      <li>
        <a href="#" class="nav-link" data-page="obras">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </span>
          <span>Obras</span>
        </a>
      </li>
      <li>
        <a href="#" class="nav-link" data-page="alertas">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </span>
          <span>Alertas &amp; Certificações</span>
          <span class="nav-badge" id="navBadgeAlertas"></span>
        </a>
      </li>
      <li>
        <a href="#" class="nav-link" data-page="custos">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <path d="M4 10h12M4 14h12M19.5 16.5A7.5 7.5 0 1 1 19.5 7.5"/>
            </svg>
          </span>
          <span>Faturação / Requisições</span>
        </a>
      </li>
      <li>
        <a href="#" class="nav-link" data-page="relatorios">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
              <line x1="2" y1="20" x2="22" y2="20"/>
            </svg>
          </span>
          <span>Relatórios</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <span>GOM v3.0 · 2025 · MVP Demo</span>
  </div>
</aside>

<!-- MAIN -->
<main class="main-content" id="main-content">
  <header class="topbar">
    <button class="btn-menu-toggle" id="menuToggle" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topbar-title" id="pageTitle">Dashboard</div>
    <div class="topbar-actions" id="topbarActions"></div>
  </header>
  <div class="page-container" id="pageContainer"></div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="18" height="18">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" role="alert"></div>

<!-- PRINT AREA -->
<div id="printArea" style="display:none;"></div>

<!-- SCRIPTS — ordem: dados → app → arranque -->
<script>
(function(){
  var bar=document.getElementById('loadingBar');
  var msg=document.getElementById('loadingMsg');
  window._loadingStep=function(pct,txt){
    if(bar)bar.style.width=pct+'%';
    if(msg)msg.textContent=txt||'';
  };
  window._loadingFim=function(){
    var el=document.getElementById('gomLoading');
    if(el){el.classList.add('oculto');setTimeout(function(){el.style.display='none';},450);}
    document.body.classList.remove('a-carregar');
  };
  window._loadingStep(10,'A inicializar dados…');
})();
</script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- Camada de dados (localStorage mock) -->
<script src="js/db.js"></script>
<!-- App principal -->
<script src="js/app.js"></script>
<!-- Arranque -->
<script src="js/fixes.js"></script>
</body>
</html>
